apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbao-server
  namespace: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
      app.kubernetes.io/instance: openbao
      component: server
  policyTypes: [Ingress]
  ingress:
    # Only members of this Raft cluster may access the cluster transport.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
              app.kubernetes.io/instance: openbao
              component: server
      ports:
        - protocol: TCP
          port: 8200
        - protocol: TCP
          port: 8201
    # Authentication and policy in OpenBao control API access from the cluster.
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8200
