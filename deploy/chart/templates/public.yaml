{{- if .Values.public.enabled }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: openbao-api
  namespace: openbao
spec:
  endpoints:
    - fqdn:
        hostname: openbao.openbao.svc.cluster.local
        port: 8200
  tls:
    sni: openbao.openbao.svc.cluster.local
    caCertificateRefs:
      - group: ''
        kind: Secret
        name: openbao-server-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openbao-public
  namespace: openbao
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: heterocloud-edge
      namespace: heterocloud-edge
      sectionName: http
  hostnames:
    - {{ .Values.public.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: openbao-api
{{- end }}
