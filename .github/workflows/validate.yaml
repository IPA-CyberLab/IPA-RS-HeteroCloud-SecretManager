name: Validate Hetero Secret Manager chart
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@v5.0.1
      - run: python -m pip install PyYAML
      - run: helm lint deploy/chart
      - run: python scripts/verify-chart.py
      - run: python -m py_compile scripts/bootstrap-openbao.py scripts/snapshot-openbao.py scripts/verify-openbao.py scripts/configure-openbao.py scripts/deploy-auth.py scripts/verify-oidc-login.py scripts/verify-restore.py scripts/revoke-bootstrap-root.py backup/snapshot-agent.py
      - run: node --check scripts/verify-oidc-login.mjs
      - run: bash -n scripts/reconcile-keycloak-client.sh
  backup-image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backup
          push: true
          tags: ghcr.io/ipa-cyberlab/ipa-rs-heterocloud-secretmanager-snapshot:sha-${{ github.sha }}
