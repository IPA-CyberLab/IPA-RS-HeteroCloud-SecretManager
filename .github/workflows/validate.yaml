name: Validate Hetero Secret Manager chart
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@v5.0.1
      - run: python -m pip install PyYAML
      - run: helm lint deploy/chart
      - run: python scripts/verify-chart.py
      - run: python -m py_compile scripts/bootstrap-openbao.py scripts/snapshot-openbao.py scripts/verify-openbao.py
